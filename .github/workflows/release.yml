name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: macos-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Verify tag and main ancestry
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not contained in origin/main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:check

  publish:
    name: Publish npm package and GitHub release
    needs: validate
    runs-on: macos-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify deterministic release toolchain
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v24.18.0" ]]
          [[ "$(npm --version)" == "11.16.0" ]]

      - name: Install dependencies
        run: npm ci

      - name: Repeat release checks after approval
        run: npm run release:check

      - name: Build final release archive
        id: pack
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          npm pack --json --silent --pack-destination release-artifacts > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";
            const [record] = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!record?.filename || !record?.integrity) throw new Error("npm pack metadata is incomplete");
            appendFileSync(process.env.GITHUB_OUTPUT, `archive=${record.filename}\nintegrity=${record.integrity}\n`);
          ' "$RUNNER_TEMP/npm-pack.json"
          archive="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))[0].filename" "$RUNNER_TEMP/npm-pack.json")"
          cd release-artifacts
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Publish or verify existing npm version
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          LOCAL_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"

          set +e
          npm view "$package_spec" dist.integrity --json > "$RUNNER_TEMP/registry-integrity.json" 2> "$RUNNER_TEMP/npm-view.err"
          view_status=$?
          set -e

          if [[ $view_status -eq 0 ]]; then
            registry_integrity="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/registry-integrity.json")"
            if [[ "$registry_integrity" != "$LOCAL_INTEGRITY" ]]; then
              echo "Registry integrity for $package_spec does not match the tagged archive." >&2
              exit 1
            fi
            echo "$package_spec already exists with identical integrity; skipping npm publish."
          elif grep -q "E404" "$RUNNER_TEMP/npm-view.err"; then
            npm publish "release-artifacts/$ARCHIVE" --access public
          else
            sed -n '1,120p' "$RUNNER_TEMP/npm-view.err" >&2
            exit "$view_status"
          fi

          verified=false
          for attempt in {1..12}; do
            set +e
            registry_json="$(npm view "$package_spec" dist.integrity --json 2>/dev/null)"
            registry_status=$?
            set -e
            registry_integrity=""
            if [[ $registry_status -eq 0 ]]; then
              registry_integrity="$(node -p "JSON.parse(process.argv[1])" "$registry_json")"
            fi
            if [[ "$registry_integrity" == "$LOCAL_INTEGRITY" ]]; then
              verified=true
              break
            fi
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            echo "Published registry integrity for $package_spec could not be verified." >&2
            exit 1
          fi

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          archive_path="release-artifacts/$ARCHIVE"
          checksum_path="${archive_path}.sha256"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$archive_path" "$checksum_path" --verify-tag --generate-notes --title "$tag"
            exit 0
          fi

          existing_dir="$(mktemp -d)"
          for asset_path in "$archive_path" "$checksum_path"; do
            asset_name="$(basename "$asset_path")"
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
              gh release download "$tag" --pattern "$asset_name" --dir "$existing_dir"
              if ! cmp -s "$asset_path" "$existing_dir/$asset_name"; then
                echo "Existing GitHub release asset $asset_name differs from the verified artifact." >&2
                exit 1
              fi
            else
              gh release upload "$tag" "$asset_path"
            fi
          done
